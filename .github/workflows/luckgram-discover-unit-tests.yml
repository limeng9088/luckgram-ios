name: Luckgram unit tests (discover)

# Foundation-only shared-activity rules (specs 25/26), tested with SwiftPM on Linux so the single
# xcode-27 Mac stays free for app builds. Same approach as the profile-details tests.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'submodules/LuckgramDiscover/**'
      - '.github/workflows/luckgram-discover-unit-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Swift version
        run: swift --version
      - name: Discover tests
        run: |
          set -euo pipefail
          C=submodules/LuckgramDiscover
          P="$RUNNER_TEMP/pkg"
          mkdir -p "$P/Sources/LuckgramDiscover" "$P/Tests/LuckgramDiscoverTests"
          cp "$C"/Sources/*.swift "$P/Sources/LuckgramDiscover/"
          cp "$C"/Tests/*.swift "$P/Tests/LuckgramDiscoverTests/"
          cat > "$P/Package.swift" <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
              name: "LuckgramDiscover",
              targets: [
                  .target(name: "LuckgramDiscover"),
                  .testTarget(name: "LuckgramDiscoverTests", dependencies: ["LuckgramDiscover"]),
              ]
          )
          SWIFT
          cd "$P" && swift test
