name: Luckgram unit tests

# Foundation-only Luckgram logic, tested with SwiftPM on Linux so the single xcode-27 Mac stays free
# for app builds. Each step copies one Foundation-only source + its tests into a throwaway package;
# a step whose source is not on this branch is skipped.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'submodules/TelegramUI/Components/LuckgramRoundVideo/**'
      - 'submodules/LuckgramUI/**'
      - 'submodules/TelegramCore/Sources/Luckgram/**'
      - 'submodules/TelegramCore/Tests/Luckgram/**'
      - '.github/workflows/luckgram-unit-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: |
          set -euo pipefail
          # module | source file | test file
          SUITES="
          LuckgramRoundVideo|submodules/TelegramUI/Components/LuckgramRoundVideo/Sources/LuckgramRoundVideoGeometry.swift|submodules/TelegramUI/Components/LuckgramRoundVideo/Tests/LuckgramRoundVideoGeometryTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/LuckgramRemoteConfigLogic.swift|submodules/LuckgramUI/Tests/LuckgramRemoteConfigLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/LuckgramAccountLogic.swift|submodules/LuckgramUI/Tests/LuckgramAccountLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Pro/LuckgramProState.swift|submodules/LuckgramUI/Tests/LuckgramProStateTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Pro/LuckgramProPerks.swift|submodules/LuckgramUI/Tests/LuckgramProPerksTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Scan/LuckgramScanLogic.swift|submodules/LuckgramUI/Tests/LuckgramScanLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Pro/LuckgramProCommunityLogic.swift|submodules/LuckgramUI/Tests/LuckgramProCommunityLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/LuckgramAnnouncementLogic.swift|submodules/LuckgramUI/Tests/LuckgramAnnouncementLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/LuckgramUpdateLogic.swift|submodules/LuckgramUI/Tests/LuckgramUpdateLogicTests.swift
          TelegramCore|submodules/TelegramCore/Sources/Luckgram/LuckgramStoreRestrictions.swift|submodules/TelegramCore/Tests/Luckgram/LuckgramStoreRestrictionsTests.swift
          TelegramCore|submodules/TelegramCore/Sources/Luckgram/LuckgramTranslateFallbackLogic.swift|submodules/TelegramCore/Tests/Luckgram/LuckgramTranslateFallbackLogicTests.swift
          TelegramCore|submodules/TelegramCore/Sources/Luckgram/LuckgramTranslateCache.swift|submodules/TelegramCore/Tests/Luckgram/LuckgramTranslateCacheTests.swift
          TelegramCore|submodules/TelegramCore/Sources/Luckgram/LuckgramTranslateInLogic.swift|submodules/TelegramCore/Tests/Luckgram/LuckgramTranslateInLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Writing/LuckgramAIWritingEntities.swift|submodules/LuckgramUI/Tests/LuckgramAIWritingEntitiesTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Onboarding/LuckgramWelcomeLogic.swift|submodules/LuckgramUI/Tests/LuckgramWelcomeLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Diag/LuckgramDiagLogic.swift|submodules/LuckgramUI/Tests/LuckgramDiagLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/LuckgramAccountLimit.swift|submodules/LuckgramUI/Tests/LuckgramAccountLimitTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Backup/LuckgramCloudBackupLogic.swift|submodules/LuckgramUI/Tests/LuckgramCloudBackupLogicTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Diag/LuckgramEndpoints.swift|submodules/LuckgramUI/Tests/LuckgramEndpointsTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/LuckgramVersionLine.swift|submodules/LuckgramUI/Tests/LuckgramVersionLineTests.swift
          LuckgramUI|submodules/LuckgramUI/Sources/Agents/LuckgramAgentMarketLogic.swift|submodules/LuckgramUI/Tests/LuckgramAgentMarketLogicTests.swift
          "
          ran=0
          for line in $SUITES; do
            IFS='|' read -r MOD SRC TST <<< "$line"
            if [ ! -f "$SRC" ] || [ ! -f "$TST" ]; then echo "skip $MOD ($SRC)"; continue; fi
            P="$RUNNER_TEMP/pkg-$(basename "$SRC" .swift)"
            mkdir -p "$P/Sources/$MOD" "$P/Tests/${MOD}Tests"
            cp "$SRC" "$P/Sources/$MOD/"
            cp "$TST" "$P/Tests/${MOD}Tests/"
            printf '%s\n' '// swift-tools-version:5.9' 'import PackageDescription' \
              "let package = Package(name: \"pkg\", targets: [.target(name: \"$MOD\"), .testTarget(name: \"${MOD}Tests\", dependencies: [\"$MOD\"])])" > "$P/Package.swift"
            (cd "$P" && swift test)
            ran=$((ran + 1))
          done
          test "$ran" -gt 0
