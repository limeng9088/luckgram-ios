name: Build Luckgram iOS (unsigned IPA)

# Unsigned release_arm64 build (bundle id com.luckgram.messenger) using the
# fake-codesigning profiles re-issued by ci/rebrand_profiles.py.
# Re-sign the IPA (Sideloadly / AltStore / your own certificate) before installing.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ['**.md']

concurrency:
  group: luckgram-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      # Source paths end up in the binary; keep them stable across builds.
      SOURCE_DIR: /Users/Shared/telegram-ios
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
      CACHE_DIR: /Users/runner/telegram-bazel-cache
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Select Xcode from versions.json
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("src/versions.json"))["xcode"])')
          echo "Xcode $XCODE_VERSION"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          # Some genrules hardcode /Applications/Xcode.app as sysroot.
          sudo rm -rf /Applications/Xcode.app
          sudo ln -s "$(readlink -f /Applications/Xcode_${XCODE_VERSION}.app)" /Applications/Xcode.app
          df -h /

      - name: Verify bundle id in fake profiles
        working-directory: src
        run: |
          BUNDLE_ID=$(python3 -c 'import json;print(json.load(open("build-system/appstore-configuration.json"))["bundle_id"])')
          echo "bundle_id=$BUNDLE_ID"
          for p in build-system/fake-codesigning/profiles/*.mobileprovision; do
            openssl smime -inform der -verify -noverify -in "$p" 2>/dev/null | grep -q "C67CF9S4VU.$BUNDLE_ID" || { echo "::error::$p not rebranded"; exit 1; }
          done

      # 从 Actions secrets 注入 Telegram api_id / api_hash；未配置则直接失败，避免回落到官方凭证
      - name: Inject Telegram API credentials
        working-directory: src
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          api_id, api_hash = os.environ.get("TG_API_ID", ""), os.environ.get("TG_API_HASH", "")
          if not re.fullmatch(r"[0-9]+", api_id) or not re.fullmatch(r"[0-9a-f]{32}", api_hash):
              sys.exit("::error::TG_API_ID / TG_API_HASH secrets missing or malformed")
          p = "build-system/appstore-configuration.json"
          d = json.load(open(p))
          d["api_id"], d["api_hash"] = api_id, api_hash
          open(p, "w").write(json.dumps(d, indent="\t") + "\n")
          print("api credentials injected")
          PY
          ! grep -q '7245de8e747a0d6fbe11f7cc14fcc0bb' build-system/appstore-configuration.json

      - name: Canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          mv "$GITHUB_WORKSPACE/src" "$SOURCE_DIR"

      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: bazel-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ github.ref_name }}-
            bazel-

      - name: Build
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -x
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER=$(( $(cat build_number_offset) + $(git rev-list --count HEAD) + GITHUB_RUN_NUMBER ))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$CACHE_DIR" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/out"
          IPA=$(ls bazel-bin/Telegram/Telegram.ipa bazel-out/*/bin/Telegram/Telegram.ipa 2>/dev/null | head -1)
          test -n "$IPA"
          cp -L "$IPA" "$GITHUB_WORKSPACE/out/Luckgram-${APP_VERSION}-${BUILD_NUMBER}.ipa"

      - name: Verify IPA bundle id / name
        run: |
          IPA=$(ls out/*.ipa)
          rm -rf /tmp/ipa && mkdir /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          PLIST=$(ls -d /tmp/ipa/Payload/*.app)/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = com.luckgram.messenger

      # luckgram-specs#57：iOS 26 以下没有 /usr/lib/swift/libswiftWebKit.dylib，App 链接了它就启动闪退。
      # 任何 Mach-O（主程序、framework、扩展）都不能链接它，弱链接也不行。失败时不发 release。
      - name: Check linked dylibs (no libswiftWebKit)
        run: bash "$SOURCE_DIR/ci/check_ios_links.sh" out/*.ipa

      - name: Save bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: bazel-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luckgram-ios-${{ github.run_number }}
          path: out/*.ipa
          if-no-files-found: error

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${APP_VERSION}-${BUILD_NUMBER}" out/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Luckgram iOS ${APP_VERSION} (${BUILD_NUMBER})" \
            --notes "Unsigned build of ${GITHUB_SHA}. Re-sign before installing."

      # S5: tell the Luckgram API about the new release (GET /v1/version).
      # master only: workflow_dispatch on feature branches also creates releases.
      - name: Publish version to Luckgram API
        if: github.ref == 'refs/heads/master'
        env:
          TOKEN_DEV: ${{ secrets.LUCKGRAM_RELEASE_TOKEN_DEV }}
          TOKEN_PROD: ${{ secrets.LUCKGRAM_RELEASE_TOKEN_PROD }}
        run: |
          TAG="ios-${APP_VERSION}-${BUILD_NUMBER}"
          BODY=$(printf '{"platform":"%s","version":"%s","build":%s,"url":"%s","source":"%s"}' \
            ios "$APP_VERSION" "$BUILD_NUMBER" "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" "${GITHUB_REPOSITORY}@${GITHUB_SHA} run ${GITHUB_RUN_NUMBER}")
          # Tokens only via env -> stdin (never argv); a missing secret skips that stage.
          set -euo pipefail
          publish() {
            local host=$1 token=$2
            if [ -z "$token" ]; then echo "skip $host (no token secret)"; return 0; fi
            printf 'Authorization: Bearer %s\n' "$token" | curl -sS --fail-with-body --retry 3 --retry-all-errors \
              -H @- -H 'Content-Type: application/json' -X POST -d "$BODY" "https://$host/v1/internal/release"
            echo
          }
          publish api-dev.luckgram.cc "${TOKEN_DEV:-}"
          publish api.luckgram.cc "${TOKEN_PROD:-}"
