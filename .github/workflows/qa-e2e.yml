name: QA E2E (iOS simulator + Maestro)

# 1) xcode-27 编 x86_64 模拟器测试包（debug_sim_x86_64，DEBUG 构建；启动参数 -LuckgramTestBackend YES 时登录 Telegram 测试服务器），上传成产物；
# 2) QA 专用 Intel Mac mac-local（self-hosted, qa-ios；Xcode 16.4，iOS 18.5 模拟器）下载、安装、跑 limeng9088/luckgram-qa 里的 Maestro 用例。
#
# 编译 job 和 build.yml 共用 concurrency 组（luckgram-ios-<ref>），xcode-27 上不会和同分支的编译同时跑。
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: '已有模拟器包的 run id（本 workflow 之前的 run，产物 luckgram-ios-sim-x86_64-*）；留空则先编译'
        required: false
        default: ''
      flows:
        description: 'luckgram-qa 里的用例路径（空格分隔），例如 maestro/ios/smoke 或 maestro/ios/features/06-keyword-folders'
        required: false
        default: 'maestro/ios/smoke'
      account:
        description: 'luckgram-qa/accounts.md 里的账号组 ID'
        required: false
        default: 'I1'
      qa_ref:
        description: 'luckgram-qa 的分支 / commit'
        required: false
        default: 'master'
      maestro_args:
        description: '额外的 maestro test 参数，例如 --exclude-tags=needs-peer'
        required: false
        default: ''
      sim_runtime:
        description: 'mac-local 上的模拟器 runtime（留空 = 最新 iOS 18.x）'
        required: false
        default: ''
  schedule:
    # master 每晚回归：北京时间 03:00（错开 Android）
    - cron: '0 19 * * *'

# 同一分支只保留最新一次 E2E
concurrency:
  group: qa-e2e-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.build_run_id == ''
    runs-on: xcode-27
    timeout-minutes: 180
    concurrency:
      group: luckgram-ios-${{ github.ref }}
      cancel-in-progress: false
    env:
      SOURCE_DIR: /Users/Shared/telegram-ios
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
      CACHE_DIR: /Users/runner/telegram-bazel-cache-sim
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Select Xcode from versions.json
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("src/versions.json"))["xcode"])')
          echo "Xcode $XCODE_VERSION"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          sudo rm -rf /Applications/Xcode.app
          sudo ln -s "$(readlink -f /Applications/Xcode_${XCODE_VERSION}.app)" /Applications/Xcode.app
          df -h /

      - name: Inject Telegram API credentials
        working-directory: src
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          api_id, api_hash = os.environ.get("TG_API_ID", ""), os.environ.get("TG_API_HASH", "")
          if not re.fullmatch(r"[0-9]+", api_id) or not re.fullmatch(r"[0-9a-f]{32}", api_hash):
              sys.exit("::error::TG_API_ID / TG_API_HASH secrets missing or malformed")
          p = "build-system/appstore-configuration.json"
          d = json.load(open(p))
          d["api_id"], d["api_hash"] = api_id, api_hash
          open(p, "w").write(json.dumps(d, indent="\t") + "\n")
          print("api credentials injected")
          PY

      - name: Canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          rm -rf "$SOURCE_DIR"
          mv "$GITHUB_WORKSPACE/src" "$SOURCE_DIR"

      - name: Restore bazel cache (simulator)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: bazel-sim-x86-master-${{ github.run_id }}
          restore-keys: |
            bazel-sim-x86-master-

      - name: Build debug_sim_x86_64
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -x
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$CACHE_DIR" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_x86_64 \
            --buildNumber=10000

          mkdir -p "$GITHUB_WORKSPACE/app"
          IPA=$(ls bazel-bin/Telegram/Telegram.ipa bazel-out/*/bin/Telegram/Telegram.ipa 2>/dev/null | head -1)
          test -n "$IPA"
          cp -L "$IPA" "$GITHUB_WORKSPACE/app/Luckgram-sim-x86_64-$(git rev-parse --short HEAD).ipa"

      # 仓库 Actions 缓存接近 10 GB 上限：模拟器缓存只由 master 保存一份，分支只读，避免挤掉编译缓存
      - name: Save bazel cache (simulator, master only)
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: bazel-sim-x86-master-${{ github.run_id }}

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: luckgram-ios-sim-x86_64-${{ github.run_number }}
          path: app/*.ipa
          if-no-files-found: error

  e2e:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, qa-ios]
    timeout-minutes: 45
    env:
      FLOWS: ${{ github.event_name == 'schedule' && 'maestro/ios/smoke maestro/ios/regression' || inputs.flows || 'maestro/ios/smoke' }}
      ACCOUNT: ${{ github.event_name == 'schedule' && 'RI' || inputs.account || 'I1' }}
      MAESTRO_ARGS: ${{ inputs.maestro_args }}
      SIM_RUNTIME: ${{ inputs.sim_runtime }}
      OUT: ${{ github.workspace }}/qa-out
    steps:
      - name: Clean workspace
        run: rm -rf qa app qa-out

      - name: Checkout luckgram-qa
        uses: actions/checkout@v4
        with:
          repository: limeng9088/luckgram-qa
          ref: ${{ inputs.qa_ref || 'master' }}
          ssh-key: ${{ secrets.QA_REPO_DEPLOY_KEY }}
          path: qa

      - name: Download simulator app
        uses: actions/download-artifact@v4
        with:
          pattern: luckgram-ios-sim-x86_64-*
          merge-multiple: true
          path: app
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check app
        run: |
          IPA=$(ls app/*.ipa | head -1)
          test -n "$IPA" || { echo "::error::no simulator app"; exit 1; }
          rm -rf "$RUNNER_TEMP/qa-ipa" && mkdir "$RUNNER_TEMP/qa-ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/qa-ipa"
          APPDIR=$(ls -d "$RUNNER_TEMP"/qa-ipa/Payload/*.app)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPDIR/Info.plist")" = com.luckgram.messenger
          /usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$APPDIR/Info.plist" | grep -q iphonesimulator || { echo "::error::not a simulator build"; exit 1; }
          BIN="$APPDIR/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPDIR/Info.plist")"
          lipo -archs "$BIN" | grep -qw x86_64 || { echo "::error::app is $(lipo -archs "$BIN"), mac-local needs x86_64"; exit 1; }
          echo "APP=$GITHUB_WORKSPACE/$IPA" >> "$GITHUB_ENV"

      - name: Test account
        run: python3 qa/ci/account.py "$ACCOUNT" >> "$GITHUB_ENV"

      - name: Run Maestro on simulator
        # 每个 flow 最多 10 分钟，整步最多 30 分钟（脚本内预算 27 分钟，超时前停下来，保证后面能上传产物）
        timeout-minutes: 30
        env:
          FLOW_TIMEOUT_MIN: '10'
          BUDGET_MIN: '24'   # 另留约 3 分钟给模拟器创建和启动
        run: bash qa/ci/ios-run.sh "$APP" $FLOWS

      - name: Remove simulators (safety net)
        if: always()
        run: |
          xcrun simctl list devices | sed -n 's/^ *luckgram-qa-[^ ]* (\([0-9A-F-]*\)).*/\1/p' | while read -r u; do
            xcrun simctl shutdown "$u" 2>/dev/null; xcrun simctl delete "$u" 2>/dev/null; echo "removed $u"
          done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: qa-out
          if-no-files-found: warn
